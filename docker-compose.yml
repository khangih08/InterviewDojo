version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: interviewdojo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interviewdojo

  # Postgres used by both prod and dev; always enabled
  postgres:
    image: postgres:16
    container_name: interviewdojo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_dojo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_dojo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interviewdojo

  # Production backend
  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: interviewdojo-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interview_dojo
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interviewdojo

  # Development backend (use: --profile dev)
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: interviewdojo-backend-dev
    command: npm run start:dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interview_dojo
    volumes:
      - ./backend/src:/app/src:delegated
      - ./backend/.env:/app/.env:ro
      - backend_uploads:/app/uploads
    ports:
      - "3001:3001"
      - "9229:9229"
    depends_on:
      - postgres
    networks:
      - interviewdojo

  # Production frontend
  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    container_name: interviewdojo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - interviewdojo

  # Development frontend (use: --profile dev)
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: interviewdojo-frontend-dev
    command: npm run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
    networks:
      - interviewdojo

networks:
  interviewdojo:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
