name: Vercel Deploy Reusable

on:
  workflow_call:
    secrets:
      VERCEL_DEPLOY_HOOK_URL:
        required: true

jobs:
  deploy-and-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Vercel deploy hook triggered."
