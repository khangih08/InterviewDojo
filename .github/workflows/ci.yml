name: CI and Deploy

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Allow manual trigger (useful for forked repos after sync)
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests and deploy directly"
        type: boolean
        default: false
      deploy_target:
        description: "What to deploy"
        type: choice
        options:
          - both
          - frontend-only
          - backend-only
          - none
        default: both

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build ──────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: npm run build

  build-frontend:
    name: Build Frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}"
          npm run build

  # ── Test ───────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test:ci

  test-frontend:
    name: Test Frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test:coverage

  # ── Deploy Backend ─────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    needs: [build-backend, test-backend]
    # Deploy on push to main/develop OR manual dispatch (skip_tests or not)
    if: |
      (github.event_name == 'push' && needs.build-backend.result == 'success' && needs.test-backend.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && needs.build-backend.result == 'success' && needs.test-backend.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_tests == true)
    # Only deploy if target includes backend
    uses: ./.github/workflows/render-deploy.yml
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

  # ── Deploy Frontend ────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [build-frontend, test-frontend]
    if: |
      (github.event_name == 'push' && needs.build-frontend.result == 'success' && needs.test-frontend.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && needs.build-frontend.result == 'success' && needs.test-frontend.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_tests == true)
    uses: ./.github/workflows/vercel-deploy.yml
    secrets:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
